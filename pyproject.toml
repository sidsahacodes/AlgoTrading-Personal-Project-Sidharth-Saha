[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-rebalancer"
version = "0.2.0"
description = "Monthly cluster-momentum equity rebalancer (PIT S&P 500 universe, HRP weights, IBKR/paper execution)."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.24",
    "yfinance>=0.2",
    "pandas-datareader>=0.10",
    "pyarrow>=14.0",
    "pandas-ta>=0.3",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "hdbscan>=0.8",
    "flask>=3.0",
    "ib_insync>=0.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
crsp = ["wrds>=3.1"]
dev = ["pytest>=8.0", "pre-commit>=3.5", "nbstripout>=0.7", "jupyter>=1.0", "matplotlib>=3.7", "seaborn>=0.12"]

[project.scripts]
mr = "momentum_rebalancer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"momentum_rebalancer.dashboard" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
